[project]
name = "summit"
version = "0.1.0"
description = "Composable self-hosted training: offline decision models and NexRL OPD orchestrated by dstack"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "dstack[all]",
]

[project.optional-dependencies]
decision = [
    "torch==2.7.1",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
]
qlora = [
    "summit[decision]",
    "peft==0.21.1",
    "bitsandbytes==0.50.2",
]
benchmark = [
    "summit[decision]",
    "pyarrow==21.0.0",
]
# Dependencies only needed on the training VM (installed by the bootstrap script).
vm = [
    "modal",
    "mini-swe-agent",
    "huggingface_hub",
]
dev = [
    "pytest>=8",
]

[project.scripts]
summit = "summit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["summit"]

# Never include local data/history/checkpoints in a source distribution.
[tool.hatch.build.targets.sdist]
include = [
    "/summit", "/tests", "/docs", "/simulation",
    "/examples/deepswe_opd.yaml", "/examples/decision_9b.yaml", "/examples/specialize_9b.yaml",
    "/scripts/prepare_typed_decisions_training.py", "/scripts/evaluate_typed_decisions.py", "/scripts/check_release.py",
    "/README.md", "/AGENTS.md", "/CLAUDE.md", "/LICENSE", "/.env.example", "/.gitignore",
    "/pyproject.toml", "/uv.lock",
]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
